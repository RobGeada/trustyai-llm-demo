        "We need to evaluate a judge that assigns separate scores for helpfulness, factuality, and instruction following. Find relevant benchmarks and avoid collapsing those dimensions into one score.",
        "Build a collection for a judge that can abstain when evidence is insufficient or experts disagree. Include calibration or uncertainty evaluation if the live catalog supports it.",
        "Create a collection for an agent that chooses the right tool and supplies valid arguments, including cases where no tool call is needed.",
        "I need to evaluate a tool-using agent on sequences where one API result determines the arguments to the next call. Find benchmarks beyond isolated function calling.",
        "Build a collection for a web-research agent that gathers evidence from multiple sources and produces a cited answer without inventing sources.",
        "Design an evaluation collection for a browser agent that fills forms and completes shopping tasks in a sandbox while respecting user constraints.",
        "Find benchmarks for a coding agent that investigates a repository, fixes a reported issue, and passes regression tests rather than only generating standalone functions.",
        "Create a collection for an agent that operates a shell in an isolated environment to inspect files, run commands, and recover from failed steps.",
        "Build a collection for a data-analysis agent that loads tables, writes analysis code, and produces numerically correct conclusions supported by its results.",
        "We need to evaluate a scheduling agent that coordinates calendars, handles time zones, and avoids booking meetings without required confirmation.",
        "Design a collection for a customer-service agent that can look up orders and issue refunds only when policy and user authorization allow it.",
        "I want to test an agent's ability to carry out a long task with dependencies, track completed steps, and avoid silently skipping requirements.",
        "Create a collection for an agent that must recover from API timeouts, malformed tool responses, and temporarily unavailable services without fabricating success.",
        "Build a collection to evaluate persistent memory in an agent, including updating changed preferences and not reusing information the user asked it to forget.",
        "Find benchmarks for a multi-agent system in which a planner, researcher, and reviewer collaborate. Explain whether the catalog evaluates coordination or only individual agents.",
        "Design a collection for an agent that browses untrusted sites and must resist prompt injections that try to steal credentials or trigger unauthorized actions.",
        "Create a collection for testing human approval boundaries: an agent may draft an email or prepare a purchase but must ask before sending or paying.",
        "I need to evaluate a database agent that can inspect schemas and run read-only queries but must never execute destructive statements or exceed its access permissions.",
        "Build a collection for an agent that edits spreadsheets using formulas, preserves existing data, and checks that the final workbook satisfies the request.",
        "Select benchmarks for a desktop agent that operates graphical applications from screenshots. Make clear if the live catalog cannot evaluate screen-based actions.",
        "Create a collection for an agent that must complete tasks within a strict tool-call budget. Report task success separately from the number and cost of calls.",
        "Design a collection for an infrastructure agent that proposes Kubernetes changes and validates them in a sandbox, with explicit approval before production changes. Identify gaps in available benchmarks.",
        "Build a collection for a vision-language assistant that answers questions about charts and tables, including numerical comparisons and misleading axes.",
        "I need an evaluation collection for document images containing scanned text, complex layouts, and handwritten annotations. Separate OCR-related coverage from reasoning over the extracted content.",
