        "Build a collection for an assistant that must ask clarifying questions when a request is ambiguous instead of guessing what the user means.",
        "Design an evaluation collection for summarizing long reports without losing key facts, inventing conclusions, or ignoring qualifications in the source.",
        "We are choosing a model for document question answering. Find benchmarks that test whether answers are supported by the supplied documents and whether citations point to the right evidence.",
        "Create a collection for a retrieval-augmented assistant that should say it cannot answer when the retrieved material does not contain enough evidence.",
        "I need to test reasoning across several retrieved documents, including cases where the sources disagree. Use up to four relevant live-catalog benchmarks and explain what they miss.",
        "Build a collection for long-context retrieval: the assistant must find relevant details among many distractors, including information near the beginning and middle of the input.",
        "Help me evaluate a writing assistant on rewriting, tone control, and preserving meaning. Distinguish benchmarks with objective checks from those requiring human or model judgments.",
        "Select a compact collection for an English-to-Spanish translation assistant, with attention to meaning preservation, idioms, and specialized terminology. Identify unsupported requirements.",
        "Create a collection to compare an assistant's question-answering quality in English, Arabic, Hindi, and Japanese. Report language coverage rather than assuming every benchmark supports all four.",
        "I need benchmarks for a coding assistant that writes Python functions from natural language requirements and passes executable tests. Build a collection using only relevant catalog entries.",
        "Put together a collection for evaluating code completion in Java, Go, and Rust. Explain any language gaps in the live catalog.",
        "Design a collection to test a developer assistant's ability to explain unfamiliar code and identify bugs without changing the program.",
