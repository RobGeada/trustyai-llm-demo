        "Build an evaluation collection for a chess-coaching assistant that interprets board diagrams, recommends legal moves, and explains strategy. Tell me if the catalog only supports part of this request.",
        "Design a collection for an assistant that helps blind users navigate a physical environment using live camera input. Search the catalog and clearly identify capabilities and real-world safety requirements it cannot validate.",
        "chatbot evals. facts + basic logic. what have you got?",
