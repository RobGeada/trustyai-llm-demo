---
# First, create a ConfigMap with your NeMo Guardrails configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: nemo-config-evalhub
data:
  config.yaml: |
    passthrough: true
    rails:
      input:
        flows:
          - language detector check input
          - hf classifier check input $classifier="prompt-injection"
          - on topic classifier check input
    
      config:
        language_detector:
          allowed_languages:
            - en
        hf_classifier:
          prompt-injection:
            engine: local
            model: "RedHatAI/wolf-defender-prompt-injection"
            task: text-classification
            threshold: 0.5
            blocked_labels:
              - "injection"
  rails.co: |
    define flow on topic classifier check input
      $result = execute on_topic_classifier_check_input
      if $result.is_blocked
        bot refuse to respond
        stop

  actions.py: |
    import numpy as np
    import logging
    from scipy import spatial
    from typing import Optional
    
    from nemoguardrails.actions import action
    from nemoguardrails.actions.rail_outcome import RailOutcome
    from nemoguardrails.embeddings.providers.fastembed import FastEmbedEmbeddingModel
    
    log = logging.getLogger(__name__)
    
    # ==== USER TUNING =====================================================================================================
    # === LENIENCE ==========
    # === LENIENCE ==========
    # Lower the LENIENCE constant to make the classifier STRICTER (will block more prompts)
    # Increase the LENIENCE constant to make the classifier more LENIENT (will allow more prompts)
    # Reasonable values range from 0 to 5ish - roughly 2.0 seems to maximize accuracy
    # LENIENCE < -5.3 will block all prompts
    # LENIENCE > 16.2 will allow all prompts 
    LENIENCE = 2.0
    
    # === PROMPT DATASET ====
    # Add, remove, or modify these prompts to define what "on-topic" prompts are.
    # The classifier will allow similar prompts to those in this dataset.
    PROMPT_DATASET = [
        "Design a collection to evaluate an assistant’s factual question answering. Use up to two relevant benchmarks from the live catalog and explain any gaps.",
