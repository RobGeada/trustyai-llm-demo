# Then create the NemoGuardrails resource
apiVersion: trustyai.opendatahub.io/v1alpha1
kind: NemoGuardrails
metadata:
  name: nemoguardrails-evalhub
spec:
  nemoConfigs:
    - name: main-config
      configMaps:
        - nemo-config-evalhub
      default: true