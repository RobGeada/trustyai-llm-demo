        "I need a collection for a finance assistant that interprets earnings reports, performs calculations, and grounds its answers in tables and accompanying text.",
        "Build a collection for an insurance assistant that explains coverage and exclusions from policy documents. Prioritize document reasoning over generic financial trivia.",
        "Find benchmarks for a cybersecurity assistant that explains vulnerabilities and recommends defensive mitigations. Include a way to assess unsafe guidance if the catalog supports it.",
