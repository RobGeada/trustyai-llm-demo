        "Testing brief: enterprise agent, retrieved private docs, external tools, hostile inputs. Return a catalog-backed collection organized by failure mode rather than by provider.",
        "what can i use to eval a mental-health support chatbot? empathy matters, but unsafe advice is the bigger worry. be clear about what benchmarks can't certify",
        "Please assemble a collection for comparing a quantized assistant with its full-precision version. Prioritize reasoning and instruction-following regressions; keep hardware performance separate.",
        "We need a red-team collection for our customer bot, but include harmless lookalike prompts too so a model that refuses everything won't look good.",
        "My CEO wants one score for the assistant. I'd rather see factuality, safety, and task success separately. Pick a collection that supports that breakdown.",
        "Looking for evaluation coverage for a robot-control language agent working from camera input. Search what's actually available; don't pass off text-only planning as physical safety validation.",
        "Can you pull a balanced collection for our launch review: assistant answers, judge reliability, and tool-using agent behavior? Up to six benchmarks, with overlaps and missing coverage called out."
    ]
    
    # === GLOBAL CONSTANTS =================================================================================================
    MODEL = FastEmbedEmbeddingModel("sentence-transformers/all-MiniLM-L6-v2")
    FIT = None
    
    # === HELPER FUNCTIONS =================================================================================================
    def _distance(centroid, new_doc):
        """return the cosine distance between centroid and new_doc"""
        new_doc_encoding = np.array(MODEL.encode([new_doc]))[0]
        return spatial.distance.cosine(centroid, new_doc_encoding)
    
    
    def _fit():
        """Compute or retrieve the fit parameters of the classifier"""
        global FIT
        if not FIT:
            doc_encodings = np.array(MODEL.encode(PROMPT_DATASET))
            centroid = np.mean(doc_encodings, axis=0)
            cluster_distances = [_distance(centroid, doc) for doc in PROMPT_DATASET]
            FIT = centroid, np.mean(cluster_distances), np.std(cluster_distances)
            return FIT
        else:
            return FIT
    
    
    # === MAIN ACTION ======================================================================================================
    @action()
    async def on_topic_classifier_check_input(
            context: Optional[dict] = None,
            text: Optional[str] = None,
            **kwargs,
    ) -> RailOutcome:
        """Check whether a given text is within $LENIENCE standard deviations of the topic centroid"""
    
        if text is None:
            text = (context.get("user_message") or "") if context else ""
        centroid, mean, stddev = _fit()
        threshold = mean + (stddev * LENIENCE)
    
        doc_distance = _distance(centroid, text)
    
        if doc_distance < threshold:
            log.info(f"ON TOPIC,  distance={doc_distance}: {text}")
            return RailOutcome.allow()
        else:
            log.info(f"OFF TOPIC, distance={doc_distance}: {text}")
            return RailOutcome.block(reason="off-topic", metadata={"topic_distance": doc_distance, "threshold": threshold})
